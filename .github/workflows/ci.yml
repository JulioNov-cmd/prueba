name: CI Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate mi-sitio/index.html exists
        run: |
          if [ ! -f mi-sitio/index.html ]; then
            echo "ERROR: mi-sitio/index.html no existe"
            exit 1
          fi
          echo "OK: mi-sitio/index.html existe"
